<!DOCTYPE html>
<html>
<head>
  <title>Tariff Estimator Settings</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
  <h1>Tariff Estimator Settings</h1>
  
  <div class="setting">
    <label for="tariffRate">Tariff Rate (%):</label>
    <input type="number" id="tariffRate" min="0" step="0.1" value="145"> 
  </div>

  <div class="setting">
    <label for="profitMargin">Importer Profit Margin (%):</label>
    <input type="number" id="profitMargin" min="0" step="0.1" value="25">
  </div>

  <button id="saveButton">Save Settings</button>
  <p id="statusMessage"></p>

  <script src="popup.js"></script>
</body>
</html>
